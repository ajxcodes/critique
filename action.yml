name: 'Critique AI Code Reviewer'
description: 'Automated AI code review using Google Gemini with model fallback cascades, standards enforcement, inline PR comments, and thread auto-resolution.'
author: 'Alvin Jorrel Pascual <me@ajx.codes>'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'Google Gemini API key (defaults to GEMINI_API_KEY environment secret)'
    required: false
  github_token:
    description: 'GitHub token for PR commenting and thread resolution (defaults to GITHUB_TOKEN)'
    required: false
  base_ref:
    description: 'Base ref / branch to diff against (defaults to PR base branch)'
    required: false
  standards_path:
    description: 'Optional path to repository review standards markdown file'
    required: false
  post_inline_comments:
    description: 'Whether to post inline review comments for findings (true/false)'
    required: false
    default: 'true'
  post_summary_comment:
    description: 'Whether to post a review run summary comment (true/false)'
    required: false
    default: 'true'
  update_pr_description:
    description: 'Whether to update the PR description with an AI summary (true/false)'
    required: false
    default: 'true'
  strict:
    description: 'Whether to fail the action step if blocking errors (critical or error) exist (true/false)'
    required: false
    default: 'false'
  fail_on_severity:
    description: 'Minimum finding severity that fails the action step (critical, error, warning, none)'
    required: false
    default: 'error'

outputs:
  summary:
    description: 'High-level markdown summary of the review'
    value: ${{ steps.run-critique.outputs.summary }}
  confidence:
    description: 'Confidence level rating (High, Medium, Low)'
    value: ${{ steps.run-critique.outputs.confidence }}
  is_passing:
    description: 'Whether the review passed without blocking issues and with high confidence'
    value: ${{ steps.run-critique.outputs.is_passing }}
  has_blocking_issues:
    description: 'Whether critical or error findings were detected'
    value: ${{ steps.run-critique.outputs.has_blocking_issues }}
  error_count:
    description: 'Total number of critical and error findings'
    value: ${{ steps.run-critique.outputs.error_count }}
  warning_count:
    description: 'Total number of warning findings'
    value: ${{ steps.run-critique.outputs.warning_count }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js for Critique
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install & Build Critique
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Run Critique Engine
      id: run-critique
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_STANDARDS_PATH: ${{ inputs.standards_path }}
        INPUT_POST_INLINE_COMMENTS: ${{ inputs.post_inline_comments }}
        INPUT_POST_SUMMARY_COMMENT: ${{ inputs.post_summary_comment }}
        INPUT_UPDATE_PR_DESCRIPTION: ${{ inputs.update_pr_description }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        node "${{ github.action_path }}/dist/index.js"
